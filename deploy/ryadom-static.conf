root /var/www/ryadom/current;
include /etc/nginx/snippets/ryadom-api.conf;
index index.html;
charset utf-8;
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types application/javascript application/json text/css image/svg+xml;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

location ^~ /.well-known/acme-challenge/ {
    root /var/www/ryadom/acme;
    try_files $uri =404;
}

location /assets/ {
    try_files $uri =404;
    expires 1h;
}

location = /index.html {
    expires -1;
}

location = /sw.js {
    try_files $uri =404;
    expires -1;
}

location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    try_files $uri =404;
    expires -1;
}

location / {
    try_files $uri $uri/ /index.html;
}

location ~ /\. {
    deny all;
}
