server {
    listen 80;
    listen [::]:80;
    server_name ryadomhelp.online www.ryadomhelp.online;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ryadom/acme;
        try_files $uri =404;
    }
    location / { return 301 https://ryadomhelp.online$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name 194.58.114.49;
    include /etc/nginx/snippets/ryadom-static.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ryadomhelp.online www.ryadomhelp.online;
    ssl_certificate /etc/letsencrypt/live/ryadomhelp.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ryadomhelp.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RYADOM:10m;
    ssl_session_timeout 1d;
    if ($host = www.ryadomhelp.online) {
        return 301 https://ryadomhelp.online$request_uri;
    }
    include /etc/nginx/snippets/ryadom-static.conf;
    access_log /var/log/nginx/ryadom-access.log;
    error_log /var/log/nginx/ryadom-error.log;
}
